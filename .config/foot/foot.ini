# ==============================================================================
# FOOT TERMINAL EMULATOR
# ==============================================================================

# Shell configuration fallbacks
shell=${SHELL}
term=foot
login-shell=no

# Window Geometry Rules
app-id=foot
title=Terminal
locked-title=no

# Font
font=JetBrainsMonoNerdFont:size=11:weight=bold
font-bold=JetBrainsMonoNerdFont:size=11:weight=bold
font-italic=JetBrainsMonoNerdFont:size=11:style=italic
font-bold-italic=JetBrainsMonoNerdFont:size=11:weight=bold:style=italic
line-height=15
letter-spacing=0

initial-window-size-pixels=880x540
initial-window-mode=windowed

pad=12x12 center-when-maximized-and-fullscreen
resize-by-cells=no
resize-delay-ms=50

bold-text-in-bright=no
word-delimiters=,│`|:"'()[]{}<>
selection-target=primary
workers=4

[scrollback]
lines=5000
multiplier=3.0
indicator-position=relative
indicator-format=  %p%%

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
style=curly
osc8-underline=url-mode

[cursor]
style=block
blink=yes
blink-rate=500
beam-thickness=1.5

[mouse]
hide-when-typing=yes


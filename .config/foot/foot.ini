# ==============================================================================
# FOOT TERMINAL EMULATOR CONFIGURATION (Catppuccin Mocha Edition)
# ==============================================================================

# Shell configuration fallbacks
shell=${SHELL}
term=foot
login-shell=no

# Window Geometry Rules
app-id=foot
title=Terminal
locked-title=no

# Font Matrix (Enforcing True Monospace for Code Alignment)
font=JetBrainsMonoNerdFont:size=11:weight=bold
font-bold=JetBrainsMonoNerdFont:size=11:weight=bold
font-italic=JetBrainsMonoNerdFont:size=11:style=italic
font-bold-italic=JetBrainsMonoNerdFont:size=11:weight=bold:style=italic
line-height=15
letter-spacing=0

# Initial Canvas Boundaries
initial-window-size-pixels=880x540
initial-window-mode=windowed

# Padding Layout (Adds breathing room away from physical container borders)
pad=12x12 center-when-maximized-and-fullscreen
resize-by-cells=no
resize-delay-ms=50

bold-text-in-bright=no
word-delimiters=,│`|:"'()[]{}<>
selection-target=primary
workers=4

[scrollback]
lines=5000                     # Deep scrollback tracking memory
multiplier=3.0
indicator-position=relative
indicator-format=  %p%%

[url]
launch=xdg-open ${url}         # Auto-opens highlighted links instantly in your browser
label-letters=sadfjklewcmpgh
style=curly
osc8-underline=url-mode

[cursor]
style=block
blink=yes                      # Clean terminal cursor behavior
blink-rate=500
beam-thickness=1.5

[mouse]
hide-when-typing=yes           # Seamless focus while slamming code on your keyboard

# ==============================================================================
# THEME COLOR PALETTE: CATPPUCCIN MOCHA
# ==============================================================================
[colors]
alpha=0.94                     # Subtle background frost window tracking
background=11111b              # Base Pitch Black
foreground=cdd6f4              # Text Soft White

## Normal/Regular Colors (0-7)
regular0=45475a                # Surface 1
regular1=f38ba8                # Red
regular2=a6e3a1                # Green
regular3=f9e2af                # Yellow
regular4=89b4fa                # Blue
regular5=f5c2e7                # Pink
regular6=94e2d5                # Teal
regular7=bac2de                # Subtext 1

## Bright Colors (8-15)
bright0=585b70                 # Surface 2
bright1=f38ba8                 # Bright Red
bright2=a6e3a1                 # Bright Green
bright3=f9e2af                 # Bright Yellow
bright4=89b4fa                 # Bright Blue
bright5=f5c2e7                 # Bright Pink
bright6=94e2d5                 # Bright Teal
bright7=a6adc8                 # Subtext 0

## Selection & UI Accents
selection-foreground=11111b
selection-background=b4befe    # Light Lavender selection bounding box
urls=89b4fa                    # Clickable hyperlink glow

[csd]
preferred=none                 # Disables generic GTK borders. Sway handles framing natively.

# ==============================================================================
# DEVELOPER MOUSE & KEY BINDINGS
# ==============================================================================
[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control=equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o

[search-bindings]
cancel=Control+g Control+c Escape
commit=Return KP_Enter
find-prev=Control+r
find-next=Control+s

[mouse-bindings]
primary-paste=BTN_MIDDLE
select-begin=BTN_LEFT
select-word=BTN_LEFT-2
select-row=BTN_LEFT-4

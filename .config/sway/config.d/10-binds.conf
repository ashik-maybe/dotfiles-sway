# Fedora Regolith - Keybindings (Regolith-style, Sway-native)
# Mod = Super. Vim-keys HJKL + arrows both work.
# Reference: https://regolith-desktop.com/docs/using-regolith/keybindings

# ---- Launchers (Regolith core) ----
bindsym $mod+space exec $launcher
bindsym $mod+d exec $launcher
bindsym $mod+Ctrl+space exec $clipboard
bindsym $mod+Tab exec $window_switcher
bindsym $mod+Ctrl+Tab exec $window_switcher

# ---- Terminal + Apps ----
bindsym $mod+Return exec $term
bindsym $mod+Ctrl+Return exec $term
bindsym $mod+e exec $editor
bindsym $mod+b exec $browser
bindsym $mod+Shift+t exec $term --working-directory=$HOME
bindsym $mod+Shift+f exec $fileman

# ---- Drop Terminal (Regolith scratchpad) ----
bindsym $mod+grave floating enable, resize set 1200x700, move position center, exec $term --title regolith-drop
# Toggle scratchpad for drop terminal
bindsym $mod+Ctrl+grave move scratchpad
bindsym $mod+Ctrl+grave scratchpad show

# ---- Window Management (Regolith Tactile) ----
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

bindsym $mod+Ctrl+$left resize shrink width 10px
bindsym $mod+Ctrl+$down resize grow height 10px
bindsym $mod+Ctrl+$up resize shrink height 10px
bindsym $mod+Ctrl+$right resize grow width 10px
bindsym $mod+Ctrl+Left resize shrink width 10px
bindsym $mod+Ctrl+Down resize grow height 10px
bindsym $mod+Ctrl+Up resize shrink height 10px
bindsym $mod+Ctrl+Right resize grow width 10px

bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent
bindsym $mod+Shift+q kill
bindsym $mod+q kill
bindsym $mod+Ctrl+q kill

# ---- Layout ----
bindsym $mod+h splitv
bindsym $mod+v splith
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+Ctrl+t layout toggle split
bindsym $mod+Shift+l layout toggle split

# ---- Workspaces ----
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

bindsym $mod+Ctrl+1 move container to workspace number $ws1, workspace number $ws1
bindsym $mod+Ctrl+2 move container to workspace number $ws2, workspace number $ws2
bindsym $mod+Ctrl+3 move container to workspace number $ws3, workspace number $ws3
bindsym $mod+Ctrl+4 move container to workspace number $ws4, workspace number $ws4
bindsym $mod+Ctrl+5 move container to workspace number $ws5, workspace number $ws5

bindsym $mod+Ctrl+Left workspace prev_on_output
bindsym $mod+Ctrl+Right workspace next_on_output
bindsym $mod+Ctrl+Left workspace prev_on_output
bindsym $mod+Ctrl+Right workspace next_on_output

# ---- Scratchpad (Regolith style: U/I/O/P controls) ----
# Instead of U/I/O/P, use explicit: U=special, I=scratchpad, O=output, P=move
bindsym $mod+u scratchpad show
bindsym $mod+i move scratchpad
bindsym $mod+o scratchpad show
bindsym $mod+p move scratchpad

# ---- Mode ----
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px
    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

mode "system" {
    bindsym l exec $power lock
    bindsym s exec $power sleep
    bindsym h exec $power hibernate
    bindsym p exec $power poweroff
    bindsym Escape mode "default"
}
bindsym $mod+Shift+x mode "system"

bindsym $mod+l exec swaylock -f
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit Fedora Regolith (Sway)?' -B 'Exit' 'swaymsg exit' -b 'Cancel' ''
bindsym $mod+slash exec ~/.local/bin/regolith-help

# Move output to workspace
bindsym $mod+Shift+Ctrl+Left move workspace to output left
bindsym $mod+Shift+Ctrl+Right move workspace to output right

# Touchpad gestures
bindgesture swipe:3:left workspace prev
bindgesture swipe:3:right workspace next
bindgesture swipe:3:up exec $launcher
bindgesture swipe:3:down workspace next
